services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: expensedb
      POSTGRES_USER: expenseuser
      POSTGRES_PASSWORD: expensepass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
  web:
    build: .
    environment:
      DB_NAME: expensedb
      DB_USER: expenseuser
      DB_PASS: expensepass
      DB_HOST: db
    ports:
      - "8100:5000"
    depends_on:
      - db
    restart: always 
  nginx:
    image: nginx:alpine
    ports:
      - "8101:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    restart: always
volumes:
  postgres_data:
